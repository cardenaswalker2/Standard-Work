services:
  # 1. Backend Empresarial Spring Boot + Java 17
  - type: web
    name: track60-backend
    runtime: docker
    rootDir: track60-backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: STORAGE_PROVIDER
        value: cloudinary

  # 2. Frontend Flutter Web + PWA (Static Site)
  - type: web
    name: track60-web
    runtime: static
    rootDir: track60_fin
    buildCommand: flutter build web --release --dart-define=API_BASE_URL=https://track60-backend.onrender.com/api/v1
    staticPublishPath: ./build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html


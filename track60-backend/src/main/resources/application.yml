server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  application:
    name: track60-backend
  main:
    lazy-initialization: ${SPRING_LAZY_INIT:true}
  jmx:
    enabled: false
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/track60}
      database: track60
      auto-index-creation: ${MONGO_AUTO_INDEX:false}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

track60:
  jwt:
    secret: ${JWT_SECRET:TRACK60_DEV_SECRET_KEY_CAMBIAR_EN_PRODUCCION_2026_DARNEL}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000,http://localhost:5000}
  storage:
    provider: ${STORAGE_PROVIDER:cloudinary}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
  capacity:
    superadmin-reference-limit: 8
    plant-admin-base-limit: 2

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html


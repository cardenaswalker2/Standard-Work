<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Standard Work · Darnel Group</title>
    <style>
        :root {
            --azul: #002F6C;
            --azul2: #006DB2;
            --morado: #0095D9;
            --bg: #F3F5FA;
            --verde: #16A34A;
            --verdeBg: #ECFDF3;
            --rojo: #DC2626;
            --rojoBg: #FEF2F2;
            --gris: #64748B;
            --borde: #E2E8F0;
            --txt: #4A4A49
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", "Helvetica Neue Std", Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent
        }

        body {
            background: #DDE3EE;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
        }

        .back-to-download-bar {
            margin-bottom: 16px;
            background: #002F6C;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(0, 47, 108, 0.25);
            transition: transform 0.2s;
        }

        .back-to-download-bar:hover {
            transform: translateY(-2px);
            background: #004F94;
        }

        .phone {
            width: 390px;
            height: 820px;
            background: var(--bg);
            border-radius: 40px;
            border: 10px solid #0F172A;
            overflow: hidden;
            position: relative;
            box-shadow: 0 25px 60px rgba(15, 23, 42, .35);
            display: flex;
            flex-direction: column
        }

        @media (max-width:500px) {
            body {
                background: var(--bg)
            }

            .phone {
                width: 100vw;
                height: 100vh;
                border: none;
                border-radius: 0;
                box-shadow: none
            }
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100%
        }

        .screen.on {
            display: flex
        }

        .login {
            background: linear-gradient(160deg, var(--azul) 0%, var(--morado) 100%);
            color: #fff;
            padding: 60px 28px 30px;
            flex: 1;
            display: flex;
            flex-direction: column
        }

        .logo {
            background: #fff;
            border-radius: 12px;
            padding: 8px 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: max-content
        }

        .logo img {
            height: 34px;
            display: block
        }

        .logo .lt {
            display: none;
            color: #006DB2;
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 1px;
            line-height: 1
        }

        .logo .lt small {
            display: block;
            font-size: 9px;
            letter-spacing: 3px;
            font-weight: 600;
            color: #002F6C
        }

        .login h1 {
            letter-spacing: -.5px;
            font-size: 30px;
            margin-top: 22px;
            font-weight: 700
        }

        .login p {
            opacity: .85;
            margin-top: 6px;
            font-size: 14px
        }

        .ulist {
            margin-top: 34px;
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .ubtn {
            background: rgba(255, 255, 255, .12);
            border: 1px solid rgba(255, 255, 255, .25);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            gap: 12px;
            align-items: center;
            color: #fff;
            cursor: pointer;
            transition: .2s
        }

        .ubtn:hover {
            background: rgba(255, 255, 255, .22)
        }

        .av {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #fff;
            color: var(--morado);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0
        }

        .ubtn b {
            display: block;
            font-size: 15px
        }

        .ubtn small {
            opacity: .8;
            font-size: 12px
        }

        .foot {
            margin-top: auto;
            font-size: 11px;
            opacity: .7;
            text-align: center
        }

        header {
            background: linear-gradient(135deg, var(--azul), var(--morado));
            color: #fff;
            padding: 18px 18px 16px
        }

        .hrow {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .hrow .logo {
            padding: 5px 8px;
            border-radius: 9px
        }

        .hrow .logo img {
            height: 24px
        }

        .htitle {
            flex: 1
        }

        .htitle b {
            font-size: 16px;
            display: block
        }

        .htitle small {
            font-size: 12px;
            opacity: .85
        }

        .hav {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px
        }

        .hoy {
            margin-top: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, .12);
            border-radius: 14px;
            padding: 10px 12px
        }

        .hoy b {
            font-size: 14px
        }

        .hoy small {
            display: block;
            font-size: 11px;
            opacity: .8
        }

        .prog {
            font-size: 20px;
            font-weight: 700
        }

        .bar {
            height: 6px;
            background: rgba(255, 255, 255, .25);
            border-radius: 6px;
            margin-top: 8px;
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            background: #4ADE80;
            border-radius: 6px;
            transition: .4s
        }

        .days {
            display: flex;
            gap: 6px;
            padding: 12px 14px 4px
        }

        .day {
            flex: 1;
            background: #fff;
            border: 1px solid var(--borde);
            border-radius: 12px;
            padding: 7px 0;
            text-align: center;
            cursor: pointer;
            position: relative
        }

        .day b {
            display: block;
            font-size: 13px;
            color: var(--txt)
        }

        .day small {
            font-size: 10px;
            color: var(--gris)
        }

        .day.sel {
            background: var(--azul);
            border-color: var(--azul)
        }

        .day.sel b,
        .day.sel small {
            color: #fff
        }

        .day.today:not(.sel) {
            border: 2px solid var(--azul2)
        }

        .dot {
            position: absolute;
            top: 4px;
            right: 6px;
            width: 7px;
            height: 7px;
            border-radius: 50%
        }

        .list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 14px 90px;
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .lbl {
            font-size: 12px;
            color: var(--gris);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-top: 4px
        }

        .card {
            background: #fff;
            border: 2.5px solid var(--rojo);
            border-radius: 16px;
            padding: 12px 14px;
            cursor: pointer;
            transition: .25s;
            user-select: none
        }

        .card.ok {
            border-color: var(--verde);
            background: var(--verdeBg)
        }

        .card.no {
            background: var(--rojoBg)
        }

        .card.fut {
            border-color: var(--borde);
            background: #fff;
            cursor: default
        }

        .card:active:not(.fut) {
            transform: scale(.98)
        }

        .ind {
            font-size: 11px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px
        }

        .card.ok .ind {
            color: var(--verde)
        }

        .card.no .ind {
            color: var(--rojo)
        }

        .card.fut .ind {
            color: var(--gris)
        }

        .cname {
            font-size: 18px;
            font-weight: 700;
            color: var(--txt);
            text-align: center;
            margin: 6px 0 2px
        }

        .cdesc {
            font-size: 12px;
            color: var(--gris);
            text-align: center;
            margin-bottom: 6px
        }

        .state {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 20px;
            color: #fff;
            white-space: nowrap
        }

        .card.ok .state {
            background: var(--verde)
        }

        .card.no .state {
            background: var(--rojo)
        }

        .card.fut .state {
            background: var(--gris)
        }

        .mv {
            border: none;
            background: #EEF2FF;
            color: var(--azul);
            font-weight: 700;
            font-size: 11px;
            padding: 5px 10px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap
        }

        .tag {
            font-size: 10px;
            color: var(--azul2);
            background: #E0F2FE;
            padding: 2px 7px;
            border-radius: 10px;
            font-weight: 600;
            white-space: nowrap
        }

        .fija {
            font-size: 10px;
            color: var(--azul);
            background: #DBEAFE;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: 700;
            white-space: nowrap
        }

        .empty {
            text-align: center;
            color: var(--gris);
            font-size: 13px;
            padding: 40px 10px
        }

        .fab {
            position: absolute;
            right: 20px;
            bottom: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--azul2), var(--morado));
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 109, 178, .4)
        }

        .ov {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, .45);
            display: none;
            align-items: flex-end;
            z-index: 10
        }

        .ov.on {
            display: flex
        }

        .sheet {
            background: #fff;
            width: 100%;
            border-radius: 24px 24px 0 0;
            padding: 20px 20px 28px;
            animation: up .25s ease;
            max-height: 85%;
            overflow-y: auto
        }

        @keyframes up {
            from {
                transform: translateY(100%)
            }

            to {
                transform: none
            }
        }

        .sheet h3 {
            font-size: 17px;
            color: var(--txt)
        }

        .sheet p {
            font-size: 13px;
            color: var(--gris);
            margin: 4px 0 14px
        }

        .opts {
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .opt {
            border: 1.5px solid var(--borde);
            background: #fff;
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--azul);
            cursor: pointer;
            text-align: left
        }

        .opt:hover {
            border-color: var(--azul2);
            background: #EFF6FF
        }

        .cancel {
            margin-top: 12px;
            width: 100%;
            border: none;
            background: #F1F5F9;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            color: var(--gris);
            cursor: pointer
        }

        .sheet input,
        .sheet select {
            width: 100%;
            border: 1.5px solid var(--borde);
            border-radius: 12px;
            padding: 11px;
            font-size: 14px;
            margin-bottom: 10px
        }

        .chk {
            display: flex;
            gap: 6px;
            margin-bottom: 10px
        }

        .chk label {
            flex: 1;
            text-align: center;
            border: 1.5px solid var(--borde);
            border-radius: 10px;
            padding: 8px 0;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer
        }

        .chk input {
            display: none
        }

        .chk label:has(input:checked) {
            background: var(--azul);
            color: #fff;
            border-color: var(--azul)
        }

        .prim {
            width: 100%;
            border: none;
            background: var(--azul);
            color: #fff;
            padding: 13px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer
        }

        .toast {
            position: absolute;
            left: 50%;
            bottom: 95px;
            transform: translateX(-50%);
            background: #0F172A;
            color: #fff;
            font-size: 13px;
            padding: 10px 16px;
            border-radius: 20px;
            opacity: 0;
            transition: .3s;
            pointer-events: none;
            white-space: nowrap;
            z-index: 20
        }

        .toast.on {
            opacity: 1
        }

        .menu a {
            display: block;
            padding: 12px;
            border-radius: 12px;
            color: var(--txt);
            font-size: 14px;
            cursor: pointer
        }

        .menu a:hover {
            background: #F1F5F9
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-to-download-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Volver a la página de descarga de la APK</span>
    </a>
    <div class="phone">
        <div class="screen on" id="scrLogin">
            <div class="login">
                <div class="logo"><img src="https://lmsdarnel.ajover.com/assets/images/logo-darnel.png?v=1"
                        alt="Darnel Group"
                        onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span
                        class="lt">DARNEL<small>GROUP</small></span></div>
                <h1>Standard Work</h1>
                <p>Darnel Group · Trabajo estándar de lunes a viernes</p>
                <div class="ulist" id="ulist"></div>
                <div class="foot">Darnel Group · Mockup con datos ficticios · Los registros se guardan en este navegador
                </div>
            </div>
        </div>
        <div class="screen" id="scrHome">
            <header>
                <div class="hrow">
                    <div class="logo"><img src="https://lmsdarnel.ajover.com/assets/images/logo-darnel.png?v=1"
                            alt="Darnel Group"
                            onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span
                            class="lt">DARNEL<small>GROUP</small></span></div>
                    <div class="htitle"><b>Standard Work</b><small id="hUser"></small></div>
                    <div class="hav" id="hAv" onclick="openMenu()"></div>
                </div>
                <div class="hoy">
                    <div><b id="hDia"></b><small id="hFecha"></small></div>
                    <div style="text-align:right">
                        <div class="prog" id="hProg"></div><small style="font-size:11px;opacity:.8">completadas</small>
                    </div>
                </div>
                <div class="bar"><i id="hBar"></i></div>
            </header>
            <div class="days" id="days"></div>
            <div class="list" id="list"></div>
            <button class="fab" onclick="openAdd()">+</button>
        </div>
        <div class="ov" id="ov" onclick="if(event.target.id==='ov')closeSheet()">
            <div class="sheet" id="sheet"></div>
        </div>
        <div class="toast" id="toast"></div>
    </div>

    <script>
        /* ================== DATOS FICTICIOS (10 actividades por usuario) ================== */
        const DIAS = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"], COR = ["L", "M", "X", "J", "V"];
        const LV = [1, 2, 3, 4, 5];
        const BASE = [ // Obligatorias de lunes a viernes para TODOS
            { n: "Reunión Diaria (Visual Room)", d: "Revisión de KPIs, seguridad y prioridades del día", dias: LV, fija: true },
            { n: "Gemba Walk", d: "Recorrido en piso", dias: LV, fija: true }
        ];
        const USERS = {
            X: {
                nombre: "Usuario X · Carlos Méndez", cargo: "Supervisor de Producción", ini: "CM", acts: [...BASE,
                { n: "Revisión OEE", d: "Análisis de paradas y desempeño de línea", dias: [1, 3, 5] },
                { n: "Seguimiento de Scrap", d: "Pareto de desperdicio y acciones", dias: [2, 4] },
                { n: "Auditoría 5S", d: "Orden y limpieza del área", dias: [3] },
                { n: "Verificación de setup", d: "Cambios de referencia y arranques", dias: [1, 4] },
                { n: "Seguimiento planes de acción", d: "Estado de acciones abiertas", dias: [2, 5] },
                { n: "Charla de seguridad", d: "Tema de seguridad con el turno", dias: [1] },
                { n: "Revisión de mantenimiento", d: "Órdenes de trabajo y paros programados", dias: [3] },
                { n: "Cierre semanal de indicadores", d: "Consolidado de producción", dias: [5] }]
            },
            Y: {
                nombre: "Usuario Y · Laura Pérez", cargo: "Coordinadora de Calidad", ini: "LP", acts: [...BASE,
                { n: "Liberación de lotes", d: "Verificación de producto terminado", dias: [1, 2, 4] },
                { n: "Revisión de reclamos", d: "Seguimiento RNC con clientes", dias: [1, 4] },
                { n: "Calibración de equipos", d: "Laboratorio de calidad", dias: [2] },
                { n: "Auditoría de proceso", d: "Parámetros críticos de línea", dias: [3, 5] },
                { n: "Control de no conformes", d: "Producto retenido y disposición", dias: [2, 4] },
                { n: "Revisión de PPM", d: "Defectos por millón", dias: [3] },
                { n: "Verificación de inocuidad", d: "Buenas prácticas de manufactura", dias: [1, 5] },
                { n: "Reporte semanal de calidad", d: "Consolidado para gerencia", dias: [5] }]
            },
            Z: {
                nombre: "Usuario Z · Andrés Ruiz", cargo: "Líder de Logística", ini: "AR", acts: [...BASE,
                { n: "Plan de cargue", d: "Programación de despachos", dias: [1, 3, 5] },
                { n: "Checklist montacargas", d: "Inspección preoperacional", dias: [1, 3] },
                { n: "Inventario cíclico", d: "Conteo de bodega PT", dias: [2, 4] },
                { n: "Revisión de OTIF", d: "Entregas a tiempo y completas", dias: [1, 4] },
                { n: "Control de exportaciones", d: "Documentación y contenedores", dias: [2, 5] },
                { n: "Auditoría 5S bodega", d: "Orden y señalización", dias: [3] },
                { n: "Revisión con transportadores", d: "Novedades y programación", dias: [4] },
                { n: "Cierre semanal logístico", d: "Indicadores y pendientes", dias: [5] }]
            }
        };

        /* ================== ESTADO ================== */
        let U = null, S = null, selDay = 1, HOY = 1;
        const rd = new Date().getDay(); HOY = (rd >= 1 && rd <= 5) ? rd : 1; selDay = HOY;
        function weekKey() { const d = new Date(); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - n); const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return t.getUTCFullYear() + "-W" + Math.ceil(((t - y) / 864e5 + 1) / 7); }
        const KEY = u => "SW10_" + u + "_" + weekKey();
        function seed(u) {
            let id = 1, inst = [], hist = {};
            USERS[u].acts.forEach(a => {
                const mT = 8 + Math.floor(Math.random() * 10), yT = 60 + Math.floor(Math.random() * 120), r = 0.55 + Math.random() * 0.4;
                hist[a.n] = { mD: Math.round(mT * r), mT, yD: Math.round(yT * Math.min(1, r + 0.03)), yT };
                a.dias.forEach(dd => inst.push({ id: id++, n: a.n, d: a.d, day: dd, orig: dd, fija: !!a.fija, done: dd < HOY ? Math.random() > 0.35 : false }));
            });
            return { inst, hist, cfgHoy: HOY };
        }
        function load(u) { const s = localStorage.getItem(KEY(u)); return s ? JSON.parse(s) : seed(u); }
        function save() { localStorage.setItem(KEY(U), JSON.stringify(S)); }

        /* ================== LOGIN ================== */
        function renderLogin() {
            document.getElementById("ulist").innerHTML = Object.keys(USERS).map(k => `
    <div class="ubtn" onclick="login('${k}')"><div class="av">${USERS[k].ini}</div>
    <div><b>${USERS[k].nombre}</b><small>${USERS[k].cargo} · ${USERS[k].acts.length} actividades</small></div></div>`).join("");
        }
        function login(k) {
            U = k; S = load(k); HOY = S.cfgHoy || HOY; selDay = HOY; save();
            document.getElementById("scrLogin").classList.remove("on"); document.getElementById("scrHome").classList.add("on");
            document.getElementById("hUser").textContent = USERS[k].nombre; document.getElementById("hAv").textContent = USERS[k].ini; render();
        }
        function logout() { closeSheet(); U = null; document.getElementById("scrHome").classList.remove("on"); document.getElementById("scrLogin").classList.add("on"); }

        /* ================== INDICADORES ================== */
        function ind(name) {
            const h = S.hist[name] || { mD: 0, mT: 0, yD: 0, yT: 0 };
            const wk = S.inst.filter(x => x.n === name && x.day <= HOY), wd = wk.filter(x => x.done).length, t1 = h.mT + wk.length, t2 = h.yT + wk.length;
            return { m: t1 ? Math.round((h.mD + wd) / t1 * 100) : 0, y: t2 ? Math.round((h.yD + wd) / t2 * 100) : 0 };
        }

        /* ================== RENDER ================== */
        function render() {
            const f = new Date(), mes = f.toLocaleDateString("es-CO", { month: "long" });
            const hl = S.inst.filter(x => x.day === HOY), he = hl.filter(x => x.done).length;
            hDia.textContent = "Hoy · " + DIAS[HOY - 1];
            hFecha.textContent = f.toLocaleDateString("es-CO", { day: "numeric", month: "long", year: "numeric" });
            hProg.textContent = he + "/" + hl.length; hBar.style.width = (hl.length ? he / hl.length * 100 : 0) + "%";
            days.innerHTML = DIAS.map((d, i) => {
                const n = i + 1, its = S.inst.filter(x => x.day === n); let c = "#CBD5E1";
                if (n <= HOY && its.length) c = its.every(x => x.done) ? "var(--verde)" : "var(--rojo)";
                return `<div class="day ${n === selDay ? 'sel' : ''} ${n === HOY ? 'today' : ''}" onclick="selDay=${n};render()"><span class="dot" style="background:${c}"></span><b>${COR[i]}</b><small>${n === HOY ? 'Hoy' : d.slice(0, 3)} · ${its.length}</small></div>`;
            }).join("");
            const items = S.inst.filter(x => x.day === selDay).sort((a, b) => b.fija - a.fija);
            if (!items.length) { list.innerHTML = `<div class="lbl">${DIAS[selDay - 1]}</div><div class="empty">Sin actividades para este día</div>`; return; }
            list.innerHTML = `<div class="lbl">${selDay === HOY ? 'Actividades de hoy' : 'Actividades del ' + DIAS[selDay - 1]}${selDay > HOY ? ' · programadas' : ''} (${items.length})</div>` +
                items.map(x => {
                    const k = ind(x.n), fut = selDay > HOY, cls = fut ? 'fut' : (x.done ? 'ok' : 'no'), st = fut ? 'Programada' : (x.done ? '✔ Realizada' : '✖ Pendiente');
                    const canMove = !x.fija && x.day < 5 && !x.done;
                    const accion = x.fija ? `<span class="fija">📌 Diaria L-V</span>` : (canMove ? `<button class="mv" onclick="event.stopPropagation();openMove(${x.id})">⇄ Mover</button>` : '');
                    return `<div class="card ${cls}" onclick="toggle(${x.id})">
      <div class="ind"><span>Indicador del mes (${mes}): ${k.m}%</span><span class="state">${st}</span></div>
      <div class="cname">${x.n}</div><div class="cdesc">${x.d}</div>
      <div class="ind"><span>Indicador del año ${f.getFullYear()}: ${k.y}%</span>
      <span style="display:flex;gap:6px;align-items:center">${x.orig !== x.day ? `<span class="tag">Desde ${DIAS[x.orig - 1]}</span>` : ''}${accion}</span></div></div>`;
                }).join("");
        }

        /* ================== ACCIONES ================== */
        function toggle(id) {
            const x = S.inst.find(i => i.id === id);
            if (x.day > HOY) { toast("Aún no es el día de esta actividad"); return; }
            x.done = !x.done; save(); render(); toast(x.done ? "✔ Actividad registrada como realizada" : "Actividad marcada como pendiente");
        }
        function openMove(id) {
            const x = S.inst.find(i => i.id === id), ops = []; for (let d = x.day + 1; d <= 5; d++)ops.push(d);
            sheet(`<h3>Mover "${x.n}"</h3><p>Está en <b>${DIAS[x.day - 1]}</b>. Solo puedes moverla a un día posterior (lunes a viernes).</p>
  <div class="opts">${ops.map(d => `<button class="opt" onclick="doMove(${id},${d})">→ ${DIAS[d - 1]}</button>`).join("")}</div>
  <button class="cancel" onclick="closeSheet()">Cancelar</button>`);
        }
        function doMove(id, d) { const x = S.inst.find(i => i.id === id); x.day = d; x.done = false; save(); closeSheet(); render(); toast("Actividad movida a " + DIAS[d - 1]); }
        function openAdd() {
            sheet(`<h3>Nueva actividad</h3><p>Selecciona los días (lunes a viernes) en que se realiza.</p>
  <input id="aN" placeholder="Nombre de la actividad"><input id="aD" placeholder="Descripción (opcional)">
  <div class="chk">${COR.map((c, i) => `<label><input type="checkbox" value="${i + 1}" ${i + 1 === selDay ? 'checked' : ''}>${c}</label>`).join("")}</div>
  <button class="prim" onclick="doAdd()">Guardar</button><button class="cancel" onclick="closeSheet()">Cancelar</button>`);
        }
        function doAdd() {
            const n = aN.value.trim(); if (!n) { toast("Escribe el nombre"); return; }
            const ds = [...document.querySelectorAll('.chk input:checked')].map(i => +i.value); if (!ds.length) { toast("Selecciona al menos un día"); return; }
            let id = Math.max(0, ...S.inst.map(i => i.id)); const fija = ds.length === 5;
            ds.forEach(d => S.inst.push({ id: ++id, n, d: aD.value.trim() || "Actividad registrada por el usuario", day: d, orig: d, fija, done: false }));
            if (!S.hist[n]) S.hist[n] = { mD: 0, mT: 0, yD: 0, yT: 0 }; save(); closeSheet(); selDay = ds[0]; render(); toast("Actividad registrada");
        }
        function openMenu() {
            sheet(`<h3>${USERS[U].nombre}</h3><p>${USERS[U].cargo}</p><div class="menu">
  <div style="font-size:12px;color:var(--gris);margin:4px 0 6px">🧪 Simular día de hoy (demo)</div>
  <select onchange="setHoy(+this.value)">${DIAS.map((d, i) => `<option value="${i + 1}" ${i + 1 === HOY ? 'selected' : ''}>${d}</option>`).join("")}</select>
  <a onclick="resetData()">↺ Reiniciar datos ficticios</a><a onclick="logout()">⎋ Cambiar de usuario</a></div>
  <button class="cancel" onclick="closeSheet()">Cerrar</button>`);
        }
        function setHoy(d) { HOY = d; S.cfgHoy = d; selDay = d; save(); render(); toast("Día simulado: " + DIAS[d - 1]); }
        function resetData() { localStorage.removeItem(KEY(U)); S = seed(U); save(); closeSheet(); render(); toast("Datos reiniciados"); }
        function sheet(h) { document.getElementById("sheet").innerHTML = h; ov.classList.add("on"); }
        function closeSheet() { ov.classList.remove("on"); }
        let tt; function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 1800); }
        renderLogin();
    </script>
</body>

</html>
